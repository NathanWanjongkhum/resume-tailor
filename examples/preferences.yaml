# Example preferences. Copy it, adjust to your search, then upload it:
# `tailor profile import preferences my-preferences.yaml` or the dashboard's
# Profile tab. Triage uses it: hard filters run first, in code, for free;
# survivors are scored by Claude against `wants` and `avoid`.

gmail:
  # Gmail search syntax; only matching emails are read (read-only, nothing is marked).
  query: >-
    newer_than:14d from:(jobalerts-noreply@linkedin.com OR jobs-noreply@linkedin.com
    OR ali@hiring.cafe)

hard_filters:
  # Case-insensitive regexes matched against the job title.
  title_exclude:
    - \b(senior|sr\.?|staff|principal|lead|manager|director|head of|architect)\b
    - \bmid[- ]?(level|senior)\b
    - \b(iii|iv)\b
    - \b(accountant|teller|sales|recruiter|nurse|technician)\b
  company_exclude: []
  # Postings whose minimum years of experience is above this are excluded once the
  # full posting is fetched; 0 keeps only roles that ask for none. Leave it out to
  # keep them all.
  max_years_required: 0
  # A job is kept if its location matches any of these, or if location is unknown.
  # A bare "United States" is how LinkedIn lists US-wide (usually remote) roles;
  # "Abilene, Texas, United States" should not pass.
  location_include:
    - remote
    - ^(united states|usa|us)$
    - \bor\b|oregon
    - portland|beaverton|hillsboro|vancouver, wa

triage:
  backend: plan            # plan (Claude subscription) or api
  model: claude-sonnet-5-5  # scoring doesn't need the biggest model
  effort: low
  batch_size: 8            # jobs scored per call
  max_per_run: 24          # ranked in code first; the rest wait for the next run
  # Scores are 1-5. Jobs at or above both thresholds get a tailored resume, best first
  # by relevance + desirability + recency (recency is 1-5 from the posting date).
  min_relevance: 3
  min_desirability: 3

generate:
  backend: plan
  effort: low              # low | medium | high; raise if resume wording gets worse
  max_per_run: 3           # caps plan usage per pipeline run
  require_full_posting: true  # skip jobs where only the email summary was available
  # Also write a cover letter when the posting asks for one (one more, smaller call
  # per such job). Any resume can get one from the dashboard's Cover letter tab.
  cover_letters: true

# Optional. Applications are followed through replies in Gmail (read-only): emails that
# name the company of a job you have a resume for or applied to are read, sorted by
# phrase rules (no Claude calls), and move the job to interview, offer, hired or not
# selected. Postings that are up but not taking applications are rechecked every run.
tracking:
  query: -category:promotions  # extra Gmail search terms for replies
  pending_days: 30         # stop rechecking a paused posting after this long

wants: |
  Entry-level or new-grad software roles: full-stack web, backend, or cloud.
  Remote, or on-site/hybrid near Portland, OR.
  Real engineering work and mentorship over prestige.

avoid: |
  Roles requiring 3+ years of professional experience, security clearances,
  or mostly non-engineering work (sales, support, data entry).
